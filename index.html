<style>

  }
  .card:hover {

  .card .card-header {
    display: flex;

  .card-tags {

  .card .text {

  }
  .card .text b {

  }
  .card .tip {

  }
  .card.copied {
    background: rgba(76, 175, 80, 0.12);
    border-color: rgba(76, 175, 80, 0.4);
  }
  .card.copied .tip {
    opacity: 1;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #dfc892;
    color: #121513;
    padding: 8px 18px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>

<body>
<div class="container">
  <h1>✨ PP Krit × GUCCI — Anti-Bot Engine ✨</h1>
  <p class="subtitle">Multi-Tone & Natural Style Alternating Generator</p>
  <div class="combo-badge">🔥 500M+ Anti-Spam Combinations</div>
  
  <div class="tabs">
    <div class="tab active" id="tab3" data-mode="on-ig">IG / TT</div>
    <div class="tab" id="tab4" data-mode="on-x">X (Twitter)</div>
  </div>

  <button class="btn" id="refreshBtn">🎲 Generate New Batch (8 Unique Items)</button>
  <div id="list"></div>
</div>

<div class="toast" id="toast">Copied to Clipboard ✓</div>

<script>
const DB = {
  // Strictly locked name
  NAME: "PP Krit",
  BRAND_IG: ["GUCCI", "Gucci"],
  BRAND_X: ["GUCCI", "Gucci", "@gucci"],
  MFW_VARIANTS: ["MFW", "Milan Fashion Week", "MFW26"],

  // Style 1: High-Fashion Elegant
  FORMAL: {
    starters: ["Breathtaking appearance from", "A true embodiment of elegance,", "Exuding pure sophistication,", "Sensational high-fashion moment for", "Redefining modern luxury,", "An absolutely captivating vision,", "Grace and grandeur personified in", "A mesmerizing display of haute couture from", "The epitome of refined glamour,", "Dressed to absolute perfection,", "A portrait of timeless beauty,", "Commanding attention with every stride,", "Refined, radiant, and utterly unforgettable,", "An evening of pure elegance courtesy of", "Sculpted by light and tailored to perfection,", "Every seam speaks of quiet luxury on", "Under the Milanese lights, nothing compares to", "A vision in monochrome and grace,", "The camera simply cannot do justice to", "Sophistication looks effortless on"],
    adverbs: ["effortlessly", "gracefully", "with quiet confidence", "in truly remarkable fashion", "as only he can", "with an almost cinematic grace", "like it was tailored yesterday, just for him"],
    verbs: ["presents flawless tailoring in", "commands the event effortlessly wearing", "showcases remarkable poise in", "embodies timeless glamour with", "radiates understated luxury in", "delivers a striking sartorial statement in", "elevates the entire front row wearing", "captivates every lens in", "carries the heritage of the house with grace in", "drapes himself in quiet luxury wearing", "interprets modern couture flawlessly in", "wears with an air of aristocratic ease"],
    phrases: ["with impeccable silhouette and refined aura", "highlighting exquisite facial features and regal stature", "serving ethereal beauty with a commanding presence", "a masterclass in high-fashion aesthetics and charm", "with every detail exquisitely considered", "where classic craftsmanship meets modern allure", "a seamless fusion of artistry and elegance", "with poise that could silence an entire runway", "the fabric falls as if it were made solely for him", "a study in proportion, texture, and quiet confidence", "grace woven into every thread and gesture", "beauty that feels both classic and strikingly contemporary"],
    endings: ["at Milan Fashion Week.", "for Gucci.", "an absolute highlight of the show.", "defining true elegance.", "a moment of pure couture poetry.", "reinforcing his fashion icon status.", "nothing short of extraordinary.", "destined for the best-dressed lists.", "a triumph of style and substance.", "the very definition of la dolce vita.", "leaving an indelible mark on the season.", "elegance in its most authentic form.", "pure poetry in motion.", "the kind of moment fashion history remembers.", "impossibly chic, impossibly him.", "a love letter to Italian craftsmanship.", "simply beyond compare."]
  },

  // 连接/转折词, 随机注入
  CONNECTORS: ["honestly,", "and yet,", "somehow,", "truthfully,", "and just like that,", "needless to say,", "without question,"],

  // Style 2: Fan Hype
  HYPE: {
    starters: ["OMG!!", "Look at him,", "I cannot breathe,", "Absolutely stunning,", "The main character is here,", "My heart can't handle this!!", "STOP EVERYTHING,", "Forever my favorite person,", "This is not a drill,", "He's just too precious,"],
    verbs: ["is glowing so bright in", "is making everyone take photos in", "is taking over the entire timeline in", "is serving pure perfection in", "is shining like a whole constellation in", "is blessing our feeds in", "is out-visualing everyone in", "is pure art in motion in"],
    phrases: ["such a handsome face and perfect body line", "his aura is literally out of this world", "that heavenly glow and gorgeous smile", "serving top-tier face card and unmatched elegance", "every angle is a magazine cover, every step is a statement", "the world truly isn't ready for this level of beauty", "he radiates warmth and star power at once", "one look and the whole timeline melted"],
    endings: ["so proud of him!", "he killed this look!", "can't take my eyes off!", "we love to see it!", "protect him at all costs!", "our brightest star!", "he deserves the entire world!", "always and forever supporting him!", "my heart is so full!", "the world is truly his runway!", "he was born for this moment!", "i would frame every single photo!", "tears in my eyes, pride in my heart!", "our superstar, our pride!", "this look lives in my mind rent free!", "he never misses, not once!", "simply the most beautiful person inside and out!"]
  },

  // Hype 风格专属补充
  HYPE_EXTRA: {
    interjections: ["AAAAHHH", "be so fr right now", "not the way", "yall", "i'm actually shaking", "excuse me while I pass away", "the audacity of being this beautiful"],
    fangirl_verbs: ["has me on my knees for", "is bias-wrecking everyone in", "has the whole fandom screaming over", "is collecting everyone's hearts in", "just ended every other look with"],
    soft_phrases: ["he looks like the softest dream", "that gentle smile could heal anything", "a whole warm hug in human form", "precious beyond words", "his kindness literally shines through"]
  },

  // 短句库 (3-12 单词), 约40%概率使用
  SHORT_FORMAL: [
    "PP Krit wears GUCCI like poetry.",
    "GUCCI has found its muse: PP Krit.",
    "PP Krit, pure GUCCI elegance.",
    "In GUCCI, PP Krit is unmatched.",
    "PP Krit commands GUCCI couture.",
    "GUCCI tailoring was made for PP Krit.",
    "PP Krit turns GUCCI into poetry.",
    "Nothing rivals PP Krit in GUCCI.",
    "PP Krit defines modern GUCCI luxury.",
    "GUCCI shines brighter with PP Krit.",
    "PP Krit in GUCCI: simply perfect.",
    "Every GUCCI thread suits PP Krit.",
    "PP Krit elevates every GUCCI look.",
    "GUCCI's finest moment: PP Krit.",
    "PP Krit embodies the GUCCI spirit.",
    "With PP Krit, GUCCI feels eternal."
  ],
  SHORT_HYPE: [
    "PP Krit ate this GUCCI look.",
    "GUCCI never looked this good. PP Krit!",
    "PP Krit in GUCCI broke me.",
    "This GUCCI fit on PP Krit? Perfect.",
    "PP Krit owns every GUCCI frame.",
    "GUCCI found its king: PP Krit.",
    "PP Krit makes GUCCI look effortless.",
    "No one does GUCCI like PP Krit.",
    "PP Krit and GUCCI: a perfect match.",
    "GUCCI could never miss with PP Krit.",
    "PP Krit's GUCCI era is everything.",
    "Screaming over PP Krit in GUCCI!",
    "PP Krit turns GUCCI into art.",
    "GUCCI hit the jackpot with PP Krit.",
    "PP Krit in GUCCI is my religion.",
    "This is PP Krit's GUCCI world."
  ]
};

const X_TAGS = "PP KRIT X GUCCI MFW26\n#GUCCISS27xPPKRIT\n#GucciTheStoreShow\n#Gucci #PPKritt #MFW\n@gucci @ppkritt";
const X_LIMIT = 280;
const PAGE_SIZE = 8;

const list = document.getElementById("list");
const toast = document.getElementById("toast");
let toastTimer = null;
let currentMode = "pre-ig";

const pick = arr => arr[(Math.random() * arr.length) | 0];

function buildGrammarText(isX, styleType) {
  const brandPool = isX ? DB.BRAND_X : DB.BRAND_IG;
  const brand = pick(brandPool);
  const mfw = pick(DB.MFW_VARIANTS);
  const name = DB.NAME; // Strictly locked to "PP Krit"
  
  let styleGroup, styleName;
  if (styleType === 0) {
    styleGroup = DB.FORMAL; styleName = "Elegant";
  } else {
    styleGroup = DB.HYPE; styleName = "Hype";
  }

  // 约65%概率生成短句 (5-15单词), 保证整体>60%短句占比
  if (Math.random() < 0.65) {
    let short = pick(styleType === 0 ? DB.SHORT_FORMAL : DB.SHORT_HYPE);
    // 短句内部再校验: 确保 5-15 个单词
    let guard2 = 0;
    while (guard2++ < 20) {
      const w = short.split(/\s+/).filter(Boolean).length;
      if (w >= 5 && w <= 15) break;
      short = pick(styleType === 0 ? DB.SHORT_FORMAL : DB.SHORT_HYPE);
    }
    if (isX) {
      const fullShort = short + "\n\n" + X_TAGS;
      short = fullShort.length <= X_LIMIT ? fullShort : `PP Krit x ${brand}!\n\n${X_TAGS}`;
    }
    return { text: short, styleName: styleName };
  }

  const starter = pick(styleGroup.starters);
  const verb = pick(styleGroup.verbs);
  const phrase = pick(styleGroup.phrases);
  const ending = pick(styleGroup.endings);
  // 扩充词库随机注入
  const adverb = pick(DB.FORMAL.adverbs);
  const connector = pick(DB.CONNECTORS);
  let hypeVerb = verb, hypePhrase = phrase;
  if (styleType === 1 && Math.random() < 0.5) hypeVerb = pick(DB.HYPE_EXTRA.fangirl_verbs);
  if (styleType === 1 && Math.random() < 0.5) hypePhrase = pick(DB.HYPE_EXTRA.soft_phrases);
  const useConnector = Math.random() < 0.35;

  let sentence = "";
  const structChoice = Math.floor(Math.random() * 10);

  if (structChoice === 0) {
    sentence = `${starter} ${name} ${verb} ${brand} at ${mfw}, ${phrase} - ${ending}`;
  } else if (structChoice === 1) {
    sentence = `${name} in ${brand} at ${mfw}, ${phrase}. ${starter} ${ending}`;
  } else if (structChoice === 2) {
    sentence = `${brand} x ${name} at ${mfw} is a revelation, ${phrase}! ${ending}`;
  } else if (structChoice === 3) {
    sentence = `${starter} ${name} ${verb} ${brand} at ${mfw} - ${phrase}, ${ending}`;
  } else if (structChoice === 4) {
    sentence = `${name}, ${phrase}. ${starter} ${verb} ${brand} at ${mfw}, ${ending}`;
  } else if (structChoice === 5) {
    sentence = `${starter} ${name} at ${mfw} in ${brand}: ${phrase}. ${ending}`;
  } else if (structChoice === 6) {
    sentence = `${name} ${verb} ${brand}, ${phrase}. ${starter} ${ending}`;
  } else if (structChoice === 7) {
    // 副词/连接词注入式
    sentence = `${starter} ${name} ${verb} ${brand} at ${mfw} ${adverb}, ${phrase}. ${ending}`;
  } else if (structChoice === 8) {
    // 双句组合式
    sentence = `${name} ${hypeVerb} ${brand} at ${mfw}. ${starter} ${hypePhrase} - ${ending}`;
  } else {
    // 连接词开头式
    sentence = `${useConnector ? connector + " " : ""}${name} ${verb} ${brand} at ${mfw}, ${phrase}... ${ending}`;
  }

  // 强制保证: 每条文案必须包含 PP Krit 与 GUCCI(或其变体)
  if (!sentence.includes(DB.NAME)) sentence = `${DB.NAME}, ${sentence}`;
  if (!/gucci/i.test(sentence)) sentence = `${sentence} for Gucci`;

  if (isX) {
    const fullX = sentence + "\n\n" + X_TAGS;
    if (fullX.length <= X_LIMIT) {
      sentence = fullX;
    } else {
      sentence = `${name} in ${brand} at ${mfw}! ${phrase}` + `\n\n${X_TAGS}`;
    }
  }

  return { text: sentence, styleName: styleName };
}

function getBatch() {
  const isX = currentMode.endsWith("-x");
  const results = [];
  const seen = new Set();
  let guard = 0;

  let styleIndex = 0;

  while (results.length < PAGE_SIZE && guard < 400) {
    guard++;
    const currentStyle = styleIndex % 2;
    const item = buildGrammarText(isX, currentStyle);
    
    if (seen.has(item.text)) continue;
    seen.add(item.text);
    
    results.push(item);
    styleIndex++;
  }
  return results;
}

function render() {
  list.innerHTML = "";
  const items = getBatch();
  items.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "card";
    
    const highlighted = item.text
      .replace(/PP Krit/g, m => `<b>${m}</b>`)
      .replace(/@?GUCCI|Gucci/g, m => `<b>${m}</b>`)
      .replace(/MFW\d*|Milan Fashion Week/gi, m => `<b>${m}</b>`);

    const styleClass = item.styleName === "Elegant" ? "style-formal" : "style-hype";

    card.innerHTML = `
      <div class="card-header">
        <span class="index">#${i + 1}</span>
        <div class="card-tags">
          <span class="tag ${styleClass}">${item.styleName}</span>
        </div>
      </div>
      <div class="text">${highlighted}</div>
      <div style="text-align: right; margin-top: 4px;"><span class="tip">Tap to copy</span></div>
    `;
    
    card.addEventListener("click", () => copyText(item.text, card));
    list.appendChild(card);
  });
}

async function copyText(text, card) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  card.classList.add("copied");
  card.querySelector(".tip").textContent = "Copied ✓";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
    card.classList.remove("copied");
    card.querySelector(".tip").textContent = "Tap to copy";
  }, 1500);
}

document.getElementById("refreshBtn").addEventListener("click", render);

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    if (currentMode === tab.dataset.mode) return;
    currentMode = tab.dataset.mode;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    render();
  });
});

render();
</script>
</body>
