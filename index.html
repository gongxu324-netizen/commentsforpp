<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PP Krit × RIMOWA — Caption Engine (Ultramarine & Umber Edition)</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    /* Ultramarine & Umber 柔和高级渐变背景 */
    background: linear-gradient(135deg, #F5F7FA 0%, #EAE6E1 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    color: #2D3142;
  }
  .container {
    width: 100%;
    max-width: 560px;
  }
  
  /* Ultramarine（群青蓝）双色调渐变主标题 */
  h1 {
    background: linear-gradient(135deg, #1B3B6F 0%, #2A4D8C 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.6px;
    margin-bottom: 3px;
  }
  /* Umber（暖大地棕）副标题 */
  .subtitle {
    color: #7A5C43;
    text-align: center;
    font-size: 11.5px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  
  .tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    padding: 10px 6px;
    text-align: center;
    border-radius: 10px;
    background: #E8ECEF;
    color: #4A5568;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid #D8DFE5;
    display: flex;
    justify-content: center;
    align-items: center;
    white-space: nowrap;
  }
  .tab:hover {
    background: #DFE4E8;
    color: #1B3B6F;
  }
  /* 激活状态：Ultramarine 风格调性 */
  .tab.active {
    background: #1B3B6F;
    color: #FFFFFF;
    border-color: #12284C;
    font-weight: 600;
    box-shadow: 0 3px 10px rgba(27, 59, 111, 0.25);
  }

  /* 按钮：Umber 暖色大地棕主按钮 */
  .btn {
    display: block;
    width: 100%;
    padding: 11px;
    background: #7A5C43;
    color: #FFFFFF;
    font-size: 12.5px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-bottom: 16px;
    box-shadow: 0 3px 10px rgba(122, 92, 67, 0.25);
  }
  .btn:hover {
    background: #634833;
    box-shadow: 0 5px 14px rgba(122, 92, 67, 0.35);
    transform: translateY(-1px);
  }
  
  /* 卡片质感与边框样式 */
  .card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    box-shadow: 0 2px 10px rgba(27, 59, 111, 0.04);
  }
  .card:hover {
    background: #FAF9F7;
    border-color: #C1B2A5;
    box-shadow: 0 4px 16px rgba(122, 92, 67, 0.12);
    transform: translateY(-1px);
  }
  .card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .card .index {
    font-size: 10px;
    color: #8C9BAE;
    font-weight: 600;
  }
  .card-tags {
    display: flex;
    gap: 4px;
  }
  .card .tag {
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tag.platform-ig { background: #E3E8F0; color: #1B3B6F; }
  .tag.platform-x { background: #EFEBE7; color: #7A5C43; }

  .card .text {
    font-size: 12.5px;
    color: #2D3142;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-line;
  }
  /* Ultramarine 重点高亮关键词 */
  .card .text b {
    color: #1B3B6F;
    font-weight: 600;
  }
  .card .tip {
    font-size: 10px;
    color: #7A5C43;
    opacity: 0;
    transition: opacity 0.2s;
    font-weight: 500;
  }
  .card.copied {
    background: #F2F6FA;
    border-color: #93B0D8;
  }
  .card.copied .tip {
    opacity: 1;
    color: #1B3B6F;
  }

  /* 提示弹窗：Ultramarine 群青色背景 */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1B3B6F;
    color: #FFFFFF;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    box-shadow: 0 4px 16px rgba(27, 59, 111, 0.3);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div
