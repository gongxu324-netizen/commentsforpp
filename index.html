<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PP Krit × RIMOWA — Caption Engine (Ultramarine & Umber Edition)</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #F5F7FA 0%, #EAE6E1 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    color: #2D3142;
  }
  .container {
    width: 100%;
    max-width: 560px;
  }
  h1 {
    background: linear-gradient(135deg, #1B3B6F 0%, #2A4D8C 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.6px;
    margin-bottom: 3px;
  }
  .subtitle {
    color: #7A5C43;
    text-align: center;
    font-size: 11.5px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    padding: 10px 6px;
    text-align: center;
    border-radius: 10px;
    background: #E8ECEF;
    color: #4A5568;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid #D8DFE5;
    display: flex;
    justify-content: center;
    align-items: center;
    white-space: nowrap;
  }
  .tab:hover {
    background: #DFE4E8;
    color: #1B3B6F;
  }
  .tab.active {
    background: #1B3B6F;
    color: #FFFFFF;
    border-color: #12284C;
    font-weight: 600;
    box-shadow: 0 3px 10px rgba(27, 59, 111, 0.25);
  }
  .btn {
    display: block;
    width: 100%;
    padding: 11px;
    background: #7A5C43;
    color: #FFFFFF;
    font-size: 12.5px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-bottom: 16px;
    box-shadow: 0 3px 10px rgba(122, 92, 67, 0.25);
  }
  .btn:hover {
    background: #634833;
    box-shadow: 0 5px 14px rgba(122, 92, 67, 0.35);
    transform: translateY(-1px);
  }
  .card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    box-shadow: 0 2px 10px rgba(27, 59, 111, 0.04);
  }
  .card:hover {
    background: #FAF9F7;
    border-color: #C1B2A5;
    box-shadow: 0 4px 16px rgba(122, 92, 67, 0.12);
    transform: translateY(-1px);
  }
  .card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .card .index {
    font-size: 10px;
    color: #8C9BAE;
    font-weight: 600;
  }
  .card-tags {
    display: flex;
    gap: 4px;
  }
  .card .tag {
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tag.platform-ig { background: #E3E8F0; color: #1B3B6F; }
  .tag.platform-x { background: #EFEBE7; color: #7A5C43; }

  .card .text {
    font-size: 12.5px;
    color: #2D3142;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-line;
  }
  .card .text b {
    color: #1B3B6F;
    font-weight: 600;
  }
  .card .tip {
    font-size: 10px;
    color: #7A5C43;
    opacity: 0;
    transition: opacity 0.2s;
    font-weight: 500;
  }
  .card.copied {
    background: #F2F6FA;
    border-color: #93B0D8;
  }
  .card.copied .tip {
    opacity: 1;
    color: #1B3B6F;
  }
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1B3B6F;
    color: #FFFFFF;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    box-shadow: 0 4px 16px rgba(27, 59, 111, 0.3);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="container">
  <h1>✨ PP Krit × RIMOWA ✨</h1>
  <p class="subtitle">A Lifetime of Memories & Journeys | Ultramarine & Umber Edition</p>
  
  <div class="tabs">
    <div class="tab active" id="tab-ig" data-mode="ig">IG / TikTok</div>
    <div class="tab" id="tab-x" data-mode="x">X (Twitter)</div>
  </div>

  <button class="btn" id="refreshBtn">🎲 Generate New Batch (8 Unique Captions)</button>
  <div id="list"></div>
</div>

<div class="toast" id="toast">Copied to Clipboard ✓</div>

<script>
const X_HASHTAGS = "\n\nPP KRIT AT RIMOWA LAUNCH\n#RIMOWAEssentialxPPKRIT\n#PPKritt#RIMOWA @rimowa\n#RIMOWAEssential #RIMOWAColours";

const VOCAB = {
  starters: [
    "PP Krit with RIMOWA,",
    "PP Krit at the RIMOWA launch,",
    "PP Krit x RIMOWA,",
    "PP Krit on his journey with RIMOWA,",
    "PP Krit sharing travel moments with RIMOWA,",
    "PP Krit and RIMOWA celebrating life's meaningful paths,",
    "PP Krit discovering new horizons with RIMOWA,",
    "PP Krit with the RIMOWA Essential collection,",
    "PP Krit showcasing RIMOWA Essential,"
  ],
  corePhrases: [
    "every journey carries meaningful memories.",
    "a suitcase is a trusted lifelong companion.",
    "every RIMOWA suitcase tells a unique story.",
    "capturing cherished family trip memories across every path.",
    "embracing the 'Never Still' spirit together.",
    "for a lifetime of lives and unforgettable travels.",
    "luggage isn't just a tool, it's a friend for life.",
    "finding a trusted travel companion for a lifetime of memories."
  ],
  colorHighlights: [
    "highlighting the Ultramarine and Umber shades.",
    "featuring the classic Ultramarine and Umber palette.",
    "accented with Ultramarine and Umber tones."
  ],
  shortCaptions: [
    "PP Krit with RIMOWA. Every journey tells a story! Never Still.",
    "PP Krit x RIMOWA: a trusted companion for a lifetime of memories.",
    "PP Krit with RIMOWA Essential. Travel is about cherishing family trip memories.",
    "PP Krit at the RIMOWA launch, celebrating endless meaningful journeys. Never Still!",
    "PP Krit with RIMOWA: carrying lifetime memories across every path.",
    "PP Krit x RIMOWA! For a lifetime of lives and unforgettable travels.",
    "PP Krit sharing travel stories with RIMOWA. Always Never Still.",
    "PP Krit with RIMOWA Essential in Ultramarine and Umber. Truly iconic!",
    "PP Krit and RIMOWA: finding your trusted travel companion for life.",
    "PP Krit at the RIMOWA launch, exploring new horizons together.",
    "PP Krit with RIMOWA. A suitcase that holds family travel memories.",
    "PP Krit x RIMOWA Essential: more than luggage, a lifelong friend."
  ],
  mediumCaptions: [
    "PP Krit with RIMOWA! Traveling is all about creating cherished lifetime memories with family and loved ones. Never Still!",
    "PP Krit at the RIMOWA launch. A trusted suitcase is a companion that accompanies every meaningful journey in life.",
    "PP Krit with RIMOWA Essential! Every suitcase tells a unique story for a lifetime of lives and adventures.",
    "PP Krit x RIMOWA: carrying family travel memories along every beautiful path. Find your trusted companion for life.",
    "PP Krit sharing moments with RIMOWA Essential in Ultramarine and Umber. For a lifetime of memories!"
  ]
};

const PAGE_SIZE = 8;
let currentPlatform = "ig";
const toast = document.getElementById("toast");
let toastTimer = null;

// 去重集合
let historySet = new Set();

const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function getWordCount(text) {
  return text.trim().split(/\s+/).filter(Boolean).length;
}

function generateRawBody(isShortTarget) {
  if (isShortTarget) {
    if (Math.random() < 0.6) return pick(VOCAB.shortCaptions);
    const starter = pick(VOCAB.starters);
    const core = pick(VOCAB.corePhrases);
    if (Math.random() < 0.15) {
      return `${starter} ${pick(VOCAB.colorHighlights)} ${core}`;
    }
    return `${starter} ${core}`;
  } else {
    if (Math.random() < 0.5) return pick(VOCAB.mediumCaptions);
    return `${pick(VOCAB.starters)} ${pick(VOCAB.corePhrases)} ${pick(VOCAB.corePhrases)}`;
  }
}

function buildCaption(platform, isShortTarget) {
  let body = "";
  let wordCount = 0;
  let guard = 0;

  while (guard++ < 50) {
    body = generateRawBody(isShortTarget);
    if (platform === "ig") {
      body = body.replace(/@rimowa/gi, "RIMOWA");
    }
    wordCount = getWordCount(body);
    if (isShortTarget && wordCount <= 15) break;
    if (!isShortTarget && wordCount > 15 && wordCount <= 25) break;
  }

  if (wordCount > 25 || !body) {
    body = "PP Krit with RIMOWA. Every journey carries a lifetime of precious family memories.";
    wordCount = getWordCount(body);
  }

  let fullText = body;
  if (platform === "x") {
    fullText = body + X_HASHTAGS;
  }

  return { text: fullText, bodyWordCount: wordCount };
}

function formatHighlightedText(text) {
  return text
    .replace(/PP Krit/gi, "<b>PP Krit</b>")
    .replace(/RIMOWA/gi, "<b>RIMOWA</b>")
    .replace(/@rimowa/gi, "<b>@rimowa</b>");
}

function render() {
  const list = document.getElementById("list");
  if (!list) return;
  list.innerHTML = "";

  const currentBatchSet = new Set(); // 确保本次页面的 8 张卡片绝对唯一
  let itemsGenerated = 0;
  let attempts = 0;

  while (itemsGenerated < PAGE_SIZE && attempts < 300) {
    attempts++;
    const isShort = itemsGenerated < 6;
    const item = buildCaption(currentPlatform, isShort);

    // 双重去重规则：不能在当前页重复，也不在历史缓存重复
    if (!currentBatchSet.has(item.text) && !historySet.has(item.text)) {
      currentBatchSet.add(item.text);
      historySet.add(item.text);

      // 控制历史缓存容量
      if (historySet.size > 200) historySet.clear();

      const card = document.createElement("div");
      card.className = "card";

      const tagClass = currentPlatform === "ig" ? "platform-ig" : "platform-x";
      const tagLabel = currentPlatform === "ig" ? "IG/TT (No @)" : "X (Hashtags)";

      card.innerHTML = `
        <div class="card-header">
          <span class="index">#${itemsGenerated + 1} • Words: ${item.bodyWordCount}</span>
          <div class="card-tags">
            <span class="tag ${tagClass}">${tagLabel}</span>
          </div>
        </div>
        <div class="text">${formatHighlightedText(item.text)}</div>
        <div style="text-align: right; margin-top: 6px;"><span class="tip">Tap to copy</span></div>
      `;

      card.addEventListener("click", () => copyText(item.text, card));
      list.appendChild(card);
      itemsGenerated++;
    }
  }
}

async function copyText(text, card) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  card.classList.add("copied");
  card.querySelector(".tip").textContent = "Copied ✓";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
    card.classList.remove("copied");
    card.querySelector(".tip").textContent = "Tap to copy";
  }, 1500);
}

document.getElementById("refreshBtn").addEventListener("click", render);

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    if (currentPlatform === tab.dataset.mode) return;
    currentPlatform = tab.dataset.mode;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    render();
  });
});

window.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
