<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PP Krit × RIMOWA — Caption Engine (100k+ Combinations)</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #F5F7FA 0%, #EAE6E1 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    color: #2D3142;
  }
  .container {
    width: 100%;
    max-width: 560px;
  }
  h1 {
    background: linear-gradient(135deg, #1B3B6F 0%, #2A4D8C 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.6px;
    margin-bottom: 3px;
  }
  .subtitle {
    color: #7A5C43;
    text-align: center;
    font-size: 11.5px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  .tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    padding: 10px 6px;
    text-align: center;
    border-radius: 10px;
    background: #E8ECEF;
    color: #4A5568;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid #D8DFE5;
    display: flex;
    justify-content: center;
    align-items: center;
    white-space: nowrap;
  }
  .tab:hover {
    background: #DFE4E8;
    color: #1B3B6F;
  }
  .tab.active {
    background: #1B3B6F;
    color: #FFFFFF;
    border-color: #12284C;
    font-weight: 600;
    box-shadow: 0 3px 10px rgba(27, 59, 111, 0.25);
  }
  .btn {
    display: block;
    width: 100%;
    padding: 11px;
    background: #7A5C43;
    color: #FFFFFF;
    font-size: 12.5px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-bottom: 16px;
    box-shadow: 0 3px 10px rgba(122, 92, 67, 0.25);
  }
  .btn:hover {
    background: #634833;
    box-shadow: 0 5px 14px rgba(122, 92, 67, 0.35);
    transform: translateY(-1px);
  }
  .card {
    background: #FFFFFF;
    border: 1px solid #E2E8F0;
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    box-shadow: 0 2px 10px rgba(27, 59, 111, 0.04);
  }
  .card:hover {
    background: #FAF9F7;
    border-color: #C1B2A5;
    box-shadow: 0 4px 16px rgba(122, 92, 67, 0.12);
    transform: translateY(-1px);
  }
  .card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .card .index {
    font-size: 10px;
    color: #8C9BAE;
    font-weight: 600;
  }
  .card-tags {
    display: flex;
    gap: 4px;
  }
  .card .tag {
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tag.platform-ig { background: #E3E8F0; color: #1B3B6F; }
  .tag.platform-x { background: #EFEBE7; color: #7A5C43; }

  .card .text {
    font-size: 12.5px;
    color: #2D3142;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-line;
  }
  .card .text b {
    color: #1B3B6F;
    font-weight: 600;
  }
  .card .tip {
    font-size: 10px;
    color: #7A5C43;
    opacity: 0;
    transition: opacity 0.2s;
    font-weight: 500;
  }
  .card.copied {
    background: #F2F6FA;
    border-color: #93B0D8;
  }
  .card.copied .tip {
    opacity: 1;
    color: #1B3B6F;
  }
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1B3B6F;
    color: #FFFFFF;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    box-shadow: 0 4px 16px rgba(27, 59, 111, 0.3);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="container">
  <h1>✨ PP Krit × RIMOWA ✨</h1>
  <p class="subtitle">Dynamic Sentence Matrix Engine | 200,000+ Unique Captions</p>
  
  <div class="tabs">
    <div class="tab active" id="tab-ig" data-mode="ig">IG / TikTok</div>
    <div class="tab" id="tab-x" data-mode="x">X (Twitter)</div>
  </div>

  <button class="btn" id="refreshBtn">🎲 Generate New Batch (8 Unique Captions)</button>
  <div id="list"></div>
</div>

<div class="toast" id="toast">Copied to Clipboard ✓</div>

<script>
const X_HASHTAGS = "\n\nPP KRIT AT RIMOWA LAUNCH\n#RIMOWAEssentialxPPKRIT\n#PPKritt #RIMOWA @rimowa\n#RIMOWAEssential #RIMOWAColours";

// 多模块词库矩阵（提供数万级别的语法组合）
const BUILDER_VOCAB = {
  // 必须带品牌的主语（IG/TT使用，或X随机抽取）
  brandedStarters: [
    "PP Krit with RIMOWA",
    "PP Krit at the RIMOWA launch",
    "PP Krit x RIMOWA Essential",
    "PP Krit discovering new paths with RIMOWA",
    "PP Krit celebrating travel moments with RIMOWA",
    "PP Krit showcasing the RIMOWA Essential collection",
    "PP Krit and RIMOWA embark on a new journey",
    "PP Krit with the iconic RIMOWA suitcase",
    "PP Krit x RIMOWA Essential in Ultramarine and Umber",
    "PP Krit exploring horizons with RIMOWA"
  ],
  // 抽象/通用主语（X平台专用，不强求品牌词，扩充文案库）
  genericStarters: [
    "Every unforgettable journey",
    "Embarking on a new adventure",
    "Discovering the real beauty of travel",
    "A trusted travel companion",
    "Unlocking new horizons",
    "Creating lifetime memories",
    "Traveling with timeless style",
    "Exploring world-class destinations",
    "Carrying your most cherished stories",
    "Stepping into a world of elegance",
    "Experiencing life on the move",
    "Finding inspiration in every trip"
  ],
  // 核心谓语/动作短语
  actions: [
    "brings pure joy and excitement to every trip.",
    "is crafted to deliver guaranteed quality on every path.",
    "carries cherished family travel memories for a lifetime.",
    "combines German engineering with unmatched craftsmanship.",
    "is all about celebrating life's meaningful moments.",
    "promises unmatched durability and timeless design.",
    "makes every travel experience truly special.",
    "offers guaranteed quality that stands the test of time.",
    "captures the spirit of endless exploration.",
    "creates unforgettable moments with loved ones.",
    "represents the true pleasure and freedom of traveling.",
    "blends functional perfection with aesthetic beauty.",
    "ensures a lifetime of seamless and stylish journeys.",
    "turns every voyage into a cherished story."
  ],
  // 特色补充成分
  details: [
    "in stunning Ultramarine and Umber tones,",
    "with guaranteed premium craftsmanship,",
    "bringing pure travel joy to every step,",
    "designed for a lifetime of memories,",
    "backed by iconic quality and precision,",
    "making every trip effortless and elegant,",
    "crafted for true travel enthusiasts,",
    "highlighting timeless elegance and durability,"
  ],
  // 情感尾句 / 口号
  closers: [
    "Never Still!",
    "Always Never Still.",
    "A companion for life.",
    "Truly iconic!",
    "For a lifetime of journeys.",
    "Pure joy of travel!",
    "Guaranteed quality always.",
    "Every story matters.",
    "Cherish every step.",
    "Elevate your travels."
  ]
};

const PAGE_SIZE = 8;
let currentPlatform = "ig";
const toast = document.getElementById("toast");
let toastTimer = null;

// 最近 500 条历史缓存，防止重复
let historySet = new Set();

const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function getWordCount(text) {
  return text.trim().split(/\s+/).filter(Boolean).length;
}

// 动态算法拼装文案
function generateDynamicCaption(platform, isShortTarget) {
  const v = BUILDER_VOCAB;
  let starter = "";

  if (platform === "ig") {
    starter = pick(v.brandedStarters);
  } else {
    // X 平台 50% 概率带品牌主语，50% 概率不带品牌主语
    starter = Math.random() < 0.5 ? pick(v.brandedStarters) : pick(v.genericStarters);
  }

  const action = pick(v.actions);
  const closer = pick(v.closers);

  let sentence = "";
  if (isShortTarget) {
    // 动态拼接短句 (< 15 词)
    if (Math.random() < 0.4) {
      sentence = `${starter}: ${action}`;
    } else {
      sentence = `${starter}, ${action} ${closer}`;
    }
  } else {
    // 动态拼接中长句 (15-25 词)
    const detail = pick(v.details);
    sentence = `${starter}, ${detail} ${action} ${closer}`;
  }

  return sentence;
}

function buildCaption(platform, isShortTarget) {
  let body = "";
  let wordCount = 0;
  let guard = 0;

  while (guard++ < 80) {
    body = generateDynamicCaption(platform, isShortTarget);
    if (platform === "ig") {
      body = body.replace(/@rimowa/gi, "RIMOWA");
    }
    wordCount = getWordCount(body);

    if (isShortTarget && wordCount <= 15) break;
    if (!isShortTarget && wordCount > 15 && wordCount <= 26) break;
  }

  let fullText = body;
  if (platform === "x") {
    fullText = body + X_HASHTAGS;
  }

  return { text: fullText, bodyWordCount: wordCount };
}

function formatHighlightedText(text) {
  return text
    .replace(/PP Krit|PP KRIT/g, "<b>PP Krit</b>")
    .replace(/RIMOWA/g, "<b>RIMOWA</b>")
    .replace(/@rimowa/g, "<b>@rimowa</b>");
}

function render() {
  const list = document.getElementById("list");
  if (!list) return;
  list.innerHTML = "";

  const currentBatchSet = new Set();
  let itemsGenerated = 0;
  let attempts = 0;

  while (itemsGenerated < PAGE_SIZE && attempts < 500) {
    attempts++;
    const isShort = itemsGenerated < 6;
    const item = buildCaption(currentPlatform, isShort);

    // 去重检查
    if (!currentBatchSet.has(item.text) && !historySet.has(item.text)) {
      currentBatchSet.add(item.text);
      historySet.add(item.text);

      // 限制历史集合最大 500 条
      if (historySet.size > 500) {
        const arr = Array.from(historySet);
        historySet = new Set(arr.slice(250));
      }

      const card = document.createElement("div");
      card.className = "card";

      const tagClass = currentPlatform === "ig" ? "platform-ig" : "platform-x";
      const tagLabel = currentPlatform === "ig" ? "IG/TT (No @)" : "X (Hashtags)";

      card.innerHTML = `
        <div class="card-header">
          <span class="index">#${itemsGenerated + 1} • Words: ${item.bodyWordCount}</span>
          <div class="card-tags">
            <span class="tag ${tagClass}">${tagLabel}</span>
          </div>
        </div>
        <div class="text">${formatHighlightedText(item.text)}</div>
        <div style="text-align: right; margin-top: 6px;"><span class="tip">Tap to copy</span></div>
      `;

      card.addEventListener("click", () => copyText(item.text, card));
      list.appendChild(card);
      itemsGenerated++;
    }
  }
}

async function copyText(text, card) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  card.classList.add("copied");
  card.querySelector(".tip").textContent = "Copied ✓";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
    card.classList.remove("copied");
    card.querySelector(".tip").textContent = "Tap to copy";
  }, 1500);
}

document.getElementById("refreshBtn").addEventListener("click", render);

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    if (currentPlatform === tab.dataset.mode) return;
    currentPlatform = tab.dataset.mode;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    render();
  });
});

window.addEventListener("DOMContentLoaded", render);
</script>
</body>
</html>
