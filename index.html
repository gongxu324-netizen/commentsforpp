<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PP Krit × RIMOWA — Caption Engine</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    /* 莫兰迪米色/奶白色温润背景 */
    background: linear-gradient(135deg, #FDFBF7 0%, #F5F2EB 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    color: #4A4A4A;
  }
  .container {
    width: 100%;
    max-width: 560px;
  }
  
  /* 莫兰迪灰色优雅标题 */
  h1 {
    background: linear-gradient(135deg, #6C757D 0%, #495057 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.6px;
    margin-bottom: 3px;
  }
  .subtitle {
    color: #9B9488;
    text-align: center;
    font-size: 11.5px;
    margin-bottom: 14px;
    font-weight: 500;
  }
  
  .tabs {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .tab {
    padding: 10px 6px;
    text-align: center;
    border-radius: 10px;
    background: #EFECE6;
    color: #7A7369;
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    border: 1px solid #E2DDD5;
    display: flex;
    justify-content: center;
    align-items: center;
    white-space: nowrap;
  }
  .tab:hover {
    background: #E6E1D8;
    color: #5A544B;
  }
  /* 莫兰迪红棕陶土色激活状态 */
  .tab.active {
    background: #EAE1D9;
    color: #8C6D62;
    border-color: #D2C2B5;
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(140, 109, 98, 0.12);
  }

  /* 莫兰迪鼠尾草绿按钮 */
  .btn {
    display: block;
    width: 100%;
    padding: 11px;
    background: #8BA89B;
    color: #FFFFFF;
    font-size: 12.5px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-bottom: 16px;
    box-shadow: 0 3px 10px rgba(139, 168, 155, 0.25);
  }
  .btn:hover {
    background: #7B988B;
    box-shadow: 0 5px 14px rgba(139, 168, 155, 0.35);
    transform: translateY(-1px);
  }
  
  /* 羊脂质感卡片 */
  .card {
    background: #FFFFFF;
    border: 1px solid #EFECE6;
    border-radius: 12px;
    padding: 13px 15px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.25s ease;
    position: relative;
    box-shadow: 0 2px 10px rgba(180, 170, 160, 0.06);
  }
  .card:hover {
    background: #FCFBF9;
    border-color: #D2C2B5;
    box-shadow: 0 4px 16px rgba(140, 109, 98, 0.12);
    transform: translateY(-1px);
  }
  .card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .card .index {
    font-size: 10px;
    color: #B5AFA6;
    font-weight: 600;
  }
  .card-tags {
    display: flex;
    gap: 4px;
  }
  .card .tag {
    font-size: 9px;
    padding: 2px 7px;
    border-radius: 5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .tag.platform-ig { background: #EAE1D9; color: #8C6D62; }
  .tag.platform-x { background: #E1ECEB; color: #537E7B; }

  .card .text {
    font-size: 12.5px;
    color: #4A4A4A;
    line-height: 1.55;
    word-break: break-word;
    white-space: pre-line;
  }
  .card .text b {
    color: #8C6D62;
    font-weight: 600;
  }
  .card .tip {
    font-size: 10px;
    color: #8C6D62;
    opacity: 0;
    transition: opacity 0.2s;
    font-weight: 500;
  }
  .card.copied {
    background: #F1F7F4;
    border-color: #A3C9B8;
  }
  .card.copied .tip {
    opacity: 1;
    color: #537E7B;
  }

  /* 提示框 */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #8C6D62;
    color: #FFFFFF;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    box-shadow: 0 4px 16px rgba(140, 109, 98, 0.3);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>
<div class="container">
  <h1>✨ PP Krit × RIMOWA ✨</h1>
  <p class="subtitle">A Lifetime of Memories & Journeys | Essential Palette</p>
  
  <div class="tabs">
    <div class="tab active" id="tab-ig" data-mode="ig">IG / TikTok</div>
    <div class="tab" id="tab-x" data-mode="x">X (Twitter)</div>
  </div>

  <button class="btn" id="refreshBtn">🎲 Generate New Batch (8 Unique Captions)</button>
  <div id="list"></div>
</div>

<div class="toast" id="toast">Copied to Clipboard ✓</div>

<script>
// X 平台专属 Hashtags (正文结束后双换行并带有指定格式)
const X_HASHTAGS = "\n\n#RIMOWAEssentialxPPKRIT\n#PPKritt#RIMOWA @rimowa\n#RIMOWAEssential #RIMOWAColours";

// 词库构件
const VOCAB = {
  // 开头 (无任何 attend the event 相关词)
  starters: [
    "PP Krit with RIMOWA,",
    "PP Krit at the RIMOWA launch,",
    "PP Krit x RIMOWA,",
    "PP Krit on his journey with RIMOWA,",
    "PP Krit sharing travel moments with RIMOWA,",
    "PP Krit and RIMOWA celebrating life's meaningful paths,",
    "PP Krit discovering new horizons with RIMOWA,",
    "PP Krit with the RIMOWA Essential collection,",
    "PP Krit showcasing RIMOWA Essential,"
  ],

  // 核心旅途、家人记忆与伴侣感表达
  corePhrases: [
    "every journey carries meaningful memories.",
    "a suitcase is a trusted lifelong companion.",
    "every RIMOWA suitcase tells a unique story.",
    "capturing cherished family trip memories across every path.",
    "embracing the 'Never Still' spirit together.",
    "for a lifetime of lives and unforgettable travels.",
    "luggage isn't just a tool, it's a friend for life.",
    "finding a trusted travel companion for a lifetime of memories."
  ],

  // 颜色亮点 (适度控制出现频率)
  colorHighlights: [
    "highlighting the Ultramarine and Umber shades.",
    "featuring the classic Ultramarine and Umber palette.",
    "accented with Ultramarine and Umber tones."
  ],

  // 精简文案组 (<=15词)
  shortCaptions: [
    "PP Krit with RIMOWA. Every journey tells a story! Never Still.",
    "PP Krit x RIMOWA: a trusted companion for a lifetime of memories.",
    "PP Krit with RIMOWA Essential. Travel is about cherishing family trip memories.",
    "PP Krit at the RIMOWA launch, celebrating endless meaningful journeys. Never Still!",
    "PP Krit with RIMOWA: carrying lifetime memories across every path.",
    "PP Krit x RIMOWA! For a lifetime of lives and unforgettable travels.",
    "PP Krit sharing travel stories with RIMOWA. Always Never Still.",
    "PP Krit with RIMOWA Essential in Ultramarine and Umber. Truly iconic!",
    "PP Krit and RIMOWA: finding your trusted travel companion for life.",
    "PP Krit at the RIMOWA launch, exploring new horizons together.",
    "PP Krit with RIMOWA. A suitcase that holds family travel memories.",
    "PP Krit x RIMOWA Essential: more than luggage, a lifelong friend."
  ],

  // 中长文案组 (16-25词)
  mediumCaptions: [
    "PP Krit with RIMOWA! Traveling is all about creating cherished lifetime memories with family and loved ones. Never Still!",
    "PP Krit at the RIMOWA launch. A trusted suitcase is a companion that accompanies every meaningful journey in life.",
    "PP Krit with RIMOWA Essential! Every suitcase tells a unique story for a lifetime of lives and adventures.",
    "PP Krit x RIMOWA: carrying family travel memories along every beautiful path. Find your trusted companion for life.",
    "PP Krit sharing moments with RIMOWA Essential in Ultramarine and Umber. For a lifetime of memories!"
  ]
};

const PAGE_SIZE = 8;
const SEEN_KEY = "pp_rimowa_clean_seen";
const SEEN_CAP = 1000;

function loadSeen() {
  try {
    const raw = sessionStorage.getItem(SEEN_KEY);
    return raw ? new Set(JSON.parse(raw)) : new Set();
  } catch (e) { return new Set(); }
}

function saveSeen(set) {
  try {
    const arr = Array.from(set);
    sessionStorage.setItem(SEEN_KEY, JSON.stringify(arr.slice(-SEEN_CAP)));
  } catch (e) {}
}

const list = document.getElementById("list");
const toast = document.getElementById("toast");
let toastTimer = null;
let currentPlatform = "ig";

const pick = arr => arr[(Math.random() * arr.length) | 0];

function getWordCount(text) {
  return text.trim().split(/\s+/).filter(Boolean).length;
}

// 组合生成原文字段
function generateRawBody(isShortTarget) {
  if (isShortTarget) {
    if (Math.random() < 0.6) {
      return pick(VOCAB.shortCaptions);
    }
    const starter = pick(VOCAB.starters);
    const core = pick(VOCAB.corePhrases);
    // 15% 几率加入颜色点缀
    if (Math.random() < 0.15) {
      const color = pick(VOCAB.colorHighlights);
      return `${starter} ${color} ${core}`;
    }
    return `${starter} ${core}`;
  } else {
    if (Math.random() < 0.5) {
      return pick(VOCAB.mediumCaptions);
    }
    const starter = pick(VOCAB.starters);
    const core1 = pick(VOCAB.corePhrases);
    const core2 = pick(VOCAB.corePhrases);
    return `${starter} ${core1} ${core2}`;
  }
}

// 校验与卡扣字数规则
function buildCaption(platform, isShortTarget) {
  let body = "";
  let wordCount = 0;
  let guard = 0;

  while (guard++ < 50) {
    body = generateRawBody(isShortTarget);
    
    // IG / TikTok 页面内绝对禁止出现 @rimowa
    if (platform === "ig") {
      body = body.replace(/@rimowa/gi, "RIMOWA");
    }

    wordCount = getWordCount(body);

    // 80% 控制在 <= 15 词，其余控制在 16 - 25 词
    if (isShortTarget && wordCount <= 15) {
      break;
    } else if (!isShortTarget && wordCount > 15 && wordCount <= 25) {
      break;
    }
  }

  // 兜底保障
  if (wordCount > 25) {
    body = "PP Krit with RIMOWA. Every journey carries a lifetime of precious family memories.";
    wordCount = getWordCount(body);
  }

  let fullText = body;
  if (platform === "x") {
    fullText = body + X_HASHTAGS;
  }

  return {
    text: fullText,
    bodyWordCount: wordCount
  };
}

function getBatch() {
  const results = [];
  const localSeen = new Set();
  let globalSeen = loadSeen();
  let misses = 0;

  while (results.length < PAGE_SIZE) {
    // 严格满足 80% <=15词 的比例分布
    const isShortTarget = Math.random() < 0.80;
    const item = buildCaption(currentPlatform, isShortTarget);

    if (localSeen.has(item.text) || globalSeen.has(item.text)) {
      misses++;
      if (misses > 500) globalSeen.clear();
      continue;
    }

    misses = 0;
    localSeen.add(item.text);
    globalSeen.add(item.text);
    results.push(item);
  }

  saveSeen(globalSeen);
  return results;
}

function render() {
  list.innerHTML = "";
  const items = getBatch();

  items.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "card";
    
    // 高亮核心词
    const highlighted = item.text
      .replace(/PP Krit/g, "<b>PP Krit</b>")
      .replace(/RIMOWA/g, "<b>RIMOWA</b>")
      .replace(/@rimowa/g, "<b>@rimowa</b>");

    const tagClass = currentPlatform === "ig" ? "platform-ig" : "platform-x";
    const tagLabel = currentPlatform === "ig" ? "IG/TT (No @)" : "X (Hashtags)";

    card.innerHTML = `
      <div class="card-header">
        <span class="index">#${i + 1} • Words: ${item.bodyWordCount}</span>
        <div class="card-tags">
          <span class="tag ${tagClass}">${tagLabel}</span>
        </div>
      </div>
      <div class="text">${highlighted}</div>
      <div style="text-align: right; margin-top: 6px;"><span class="tip">Tap to copy</span></div>
    `;
    
    card.addEventListener("click", () => copyText(item.text, card));
    list.appendChild(card);
  });
}

async function copyText(text, card) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  card.classList.add("copied");
  card.querySelector(".tip").textContent = "Copied ✓";
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
    card.classList.remove("copied");
    card.querySelector(".tip").textContent = "Tap to copy";
  }, 1500);
}

document.getElementById("refreshBtn").addEventListener("click", render);

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    if (currentPlatform === tab.dataset.mode) return;
    currentPlatform = tab.dataset.mode;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab));
    render();
  });
});

render();
</script>
</body>
</html>
